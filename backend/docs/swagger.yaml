basePath: /
definitions:
  account.Account:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  account.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
      username:
        type: string
    type: object
  account.CreateAccountRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  account.FindByIDRequest:
    properties:
      id:
        type: integer
    type: object
  account.FindByUsernameRequest:
    properties:
      username:
        type: string
    type: object
  account.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  account.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  account.RenameRequest:
    properties:
      new_username:
        type: string
    type: object
  account.TokenPairResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  feed.FeedAuthor:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  feed.FeedVideoItem:
    properties:
      author:
        $ref: '#/definitions/feed.FeedAuthor'
      cover_url:
        type: string
      create_time:
        type: integer
      description:
        type: string
      id:
        type: integer
      is_liked:
        type: boolean
      likes_count:
        type: integer
      play_url:
        type: string
      title:
        type: string
    type: object
  feed.ListByFollowingRequest:
    properties:
      latest_time:
        type: integer
      limit:
        type: integer
    type: object
  feed.ListByFollowingResponse:
    properties:
      has_more:
        type: boolean
      next_time:
        type: integer
      video_list:
        items:
          $ref: '#/definitions/feed.FeedVideoItem'
        type: array
    type: object
  feed.ListByPopularityRequest:
    properties:
      as_of:
        description: 服务器返回的分钟时间戳；第一页传0
        type: integer
      latest_before:
        type: string
      latest_id_before:
        type: integer
      latest_popularity:
        description: DB fallback 用（可选）
        type: integer
      limit:
        type: integer
      offset:
        description: 下一页从这里开始；第一页传0
        type: integer
    type: object
  feed.ListByPopularityResponse:
    properties:
      as_of:
        type: integer
      has_more:
        type: boolean
      next_latest_before:
        type: string
      next_latest_id_before:
        type: integer
      next_latest_popularity:
        type: integer
      next_offset:
        type: integer
      video_list:
        items:
          $ref: '#/definitions/feed.FeedVideoItem'
        type: array
    type: object
  feed.ListLatestRequest:
    properties:
      latest_time:
        type: integer
      limit:
        type: integer
    type: object
  feed.ListLatestResponse:
    properties:
      has_more:
        type: boolean
      next_time:
        type: integer
      video_list:
        items:
          $ref: '#/definitions/feed.FeedVideoItem'
        type: array
    type: object
  feed.ListLikesCountRequest:
    properties:
      id_before:
        type: integer
      likes_count_before:
        type: integer
      limit:
        type: integer
    type: object
  feed.ListLikesCountResponse:
    properties:
      has_more:
        type: boolean
      next_id_before:
        type: integer
      next_likes_count_before:
        type: integer
      video_list:
        items:
          $ref: '#/definitions/feed.FeedVideoItem'
        type: array
    type: object
  social.FollowRequest:
    properties:
      vlogger_id:
        type: integer
    type: object
  social.GetAllFollowersRequest:
    properties:
      vlogger_id:
        type: integer
    type: object
  social.GetAllFollowersResponse:
    properties:
      followers:
        items:
          $ref: '#/definitions/account.Account'
        type: array
    type: object
  social.GetAllVloggersRequest:
    properties:
      follower_id:
        type: integer
    type: object
  social.GetAllVloggersResponse:
    properties:
      vloggers:
        items:
          $ref: '#/definitions/account.Account'
        type: array
    type: object
  social.UnfollowRequest:
    properties:
      vlogger_id:
        type: integer
    type: object
  swagger.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  swagger.IsLikedResponse:
    properties:
      is_liked:
        type: boolean
    type: object
  swagger.MessageResponse:
    properties:
      message:
        type: string
    type: object
  swagger.UploadCoverResponse:
    properties:
      cover_url:
        type: string
      url:
        type: string
    type: object
  swagger.UploadVideoResponse:
    properties:
      play_url:
        type: string
      url:
        type: string
    type: object
  video.Comment:
    properties:
      author_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      parent_id:
        type: integer
      reply_count:
        type: integer
      reply_to_comment_id:
        type: integer
      reply_to_user_id:
        type: integer
      reply_to_username:
        type: string
      status:
        description: '0: normal, 1: deleted'
        type: integer
      username:
        type: string
      video_id:
        type: integer
    type: object
  video.CommentsResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/video.Comment'
        type: array
    type: object
  video.DeleteCommentRequest:
    properties:
      comment_id:
        type: integer
    type: object
  video.GetAllCommentsRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      video_id:
        type: integer
    type: object
  video.GetDetailRequest:
    properties:
      id:
        type: integer
    type: object
  video.LikeRequest:
    properties:
      video_id:
        type: integer
    type: object
  video.ListByAuthorIDRequest:
    properties:
      author_id:
        type: integer
    type: object
  video.ListRepliesRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      parent_id:
        type: integer
    type: object
  video.PublishCommentRequest:
    properties:
      content:
        type: string
      parent_id:
        type: integer
      reply_to_comment_id:
        type: integer
      video_id:
        type: integer
    type: object
  video.PublishVideoRequest:
    properties:
      cover_url:
        type: string
      description:
        type: string
      play_url:
        type: string
      title:
        type: string
    type: object
  video.RepliesResponse:
    properties:
      replies:
        items:
          $ref: '#/definitions/video.Comment'
        type: array
    type: object
  video.Video:
    properties:
      author_id:
        type: integer
      cover_url:
        type: string
      create_time:
        type: string
      description:
        type: string
      id:
        type: integer
      likes_count:
        type: integer
      play_url:
        type: string
      popularity:
        type: integer
      title:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: FeedSystem Video backend API documentation.
  title: FeedSystem Video API
  version: "1.0"
paths:
  /account/changePassword:
    post:
      consumes:
      - application/json
      parameters:
      - description: change password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Change account password
      tags:
      - account
  /account/findByID:
    post:
      consumes:
      - application/json
      parameters:
      - description: account id payload
        in: body
        name: request
        required: true
        schema:
