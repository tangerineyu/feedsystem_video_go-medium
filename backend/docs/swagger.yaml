            $ref: '#/definitions/swagger.ErrorResponse'
      summary: Find account by username
      tags:
      - account
  /account/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.LoginRequest'
